# 首次推送 main 时通过 API 启用 legacy Pages（/docs），并设置仓库主页。
name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages source and homepage
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const homepage = 'https://another3000.github.io/xstudy/';
            const source = { branch: 'main', path: '/docs' };

            try {
              await github.rest.repos.getPages({ owner, repo });
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                build_type: 'legacy',
                source,
              });
              core.info('Updated existing GitHub Pages site.');
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createPagesSite({
                  owner,
                  repo,
                  build_type: 'legacy',
                  source,
                });
                core.info('Created GitHub Pages site.');
              } else {
                throw error;
              }
            }

            try {
              await github.rest.repos.update({
                owner,
                repo,
                homepage,
              });
              core.info(`Set repository homepage to ${homepage}`);
            } catch (homepageError) {
              core.warning(
                `Could not set homepage (may need repo admin): ${homepageError.message}`,
              );
            }
